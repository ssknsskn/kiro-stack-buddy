[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kiro-stack-buddy"
version = "0.1.0"
description = "Kiro IDE + M5Stack Basic BLE Buddy - デスクペットがKiroの状態を表示"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bleak>=0.22.0",
    "aiohttp>=3.9.0",
    "mpremote>=1.24.0",
    "esptool>=5.3.1",
    "pillow==12.3.0",
]

[project.scripts]
kiro-buddy-bridge = "bridge.server:main"

[tool.setuptools.packages.find]
include = ["bridge*"]

# 組織の信頼済みPyPIプロキシを使用し、依存パッケージの取得元を管理する。
[[tool.uv.index]]
url = "https://pypi.flatt.tech/simple/"
default = true
